name: 'qualm — Accessibility Regression Check'
description: 'Render-independent static accessibility linting for React/TypeScript. Fails a PR on newly introduced WCAG defects.'
author: 'Somil Sharma'
inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  target-path:
    description: 'Directory to analyse'
    required: false
    default: '.'
  diff-branch:
    description: 'Branch to diff against for regression detection'
    required: false
    default: 'main'
  fail-on:
    description: 'Severity level to fail on: error or warning'
    required: false
    default: 'error'
runs:
  using: 'node20'
  main: 'dist/cli.js'
branding:
  icon: 'shield'
  color: 'blue'

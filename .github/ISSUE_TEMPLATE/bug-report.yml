name: Bug report
description: qualm crashed, exited wrongly, or produced bad output
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: bash
      placeholder: npx qualm-a11y src/ --diff-branch main
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Full output
      description: Include the exit code if you have it.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: qualm version
      placeholder: 2.1.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "20.11.0"
    validations:
      required: true
